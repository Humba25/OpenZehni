# Baut und veroeffentlicht eine Version (SPEC.md 11.3).
#
# Ausgeloest durch einen Tag `v*`, also zum Beispiel `git tag v0.2.0 && git push
# origin v0.2.0`. Ablauf: Tests -> Build -> Signieren -> Release anlegen ->
# Zehni-Setup.exe und latest.json anhaengen.
#
# WAS VORHER EINMALIG ZU TUN IST, steht in der Release-Anleitung. Ohne die beiden
# Secrets laeuft dieser Workflow absichtlich auf einen Fehler, statt ein
# unsigniertes Release zu veroeffentlichen, das kein Updater je annimmt.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruefen:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run validate:seed
      - run: npm run check:din5008

      # Seit 0.1.6 pruefen wir auch die Rust-Seite hier. Vorher lief vor einem
      # Release nur npm -- und seit Releases direkt veroeffentlicht werden, ist
      # dieser Job die einzige Bremse vor der Auslieferung. Die
      # Pruefsummen-Reparatur in src/pruefsummen.rs schreibt in die Datenbank
      # der Nutzerin; sie ungeprueft auszuliefern waere fahrlaessig.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  bauen:
    needs: pruefen
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Lieber hier klar scheitern als spaeter ein Release herausgeben, das
      # niemand aktualisieren kann.
      #
      # Geprueft wird tauri.conf.json, nicht tauri.release.conf.json: Endpunkt
      # und oeffentlicher Schluessel stehen dort, weil der Updater ohne sie gar
      # nicht erst startet.
      - name: Vorbereitung pruefen
        shell: bash
        run: |
          set -e
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "Secret TAURI_SIGNING_PRIVATE_KEY fehlt. Siehe Release-Anleitung."
            exit 1
          fi
          if grep -q "HIER-" src-tauri/tauri.conf.json; then
            echo "In src-tauri/tauri.conf.json steht noch ein Platzhalter statt"
            echo "des oeffentlichen Schluessels oder der Release-URL."
            echo "Siehe Release-Anleitung."
            exit 1
          fi
          # Ohne diesen Block startet die gebaute App gar nicht.
          node -e "
            const c = require('./src-tauri/tauri.conf.json');
            const u = c.plugins && c.plugins.updater;
            if (!u || !u.pubkey || !u.endpoints || u.endpoints.length === 0) {
              console.error('plugins.updater fehlt oder ist unvollstaendig in tauri.conf.json.');
              console.error('Ohne diesen Block stuerzt die App beim Start ab.');
              process.exit(1);
            }
          "

      # Die Version im Tag und die in tauri.conf.json muessen zusammenpassen.
      # Sonst bietet der Updater eine Version an, die die App nicht als neuer
      # erkennt -- ein Fehler, den man sonst erst beim Anwender merkt.
      - name: Version gegen den Tag pruefen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -e
          TAG="${GITHUB_REF_NAME#v}"
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$TAG" != "$CONF" ]; then
            echo "Tag ist $TAG, tauri.conf.json sagt $CONF. Bitte angleichen."
            exit 1
          fi

      - name: Bauen, signieren und Release anlegen
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Zehni ${{ github.ref_name }}
          releaseBody: |
            Installer herunterladen, doppelklicken, fertig.

            Beim ersten Start warnt Windows, weil Zehni kein gekauftes
            Zertifikat hat. Wie man daran vorbeikommt, steht in docs/INSTALL.md.
          # Direkt veroeffentlichen, nicht als Entwurf.
          #
          # Ein Entwurf liefert keine Dateien aus: `releases/latest/download/...`
          # findet ihn nicht, und der Updater sieht nichts. Am 2026-09-16 lagen
          # deshalb zwei fertige Versionen unbemerkt herum, waehrend die
          # installierte Zehni weiter meldete, sie sei aktuell.
          #
          # Was hier herausgeht, hat vorher den Job `pruefen` bestanden: Lint,
          # alle Tests, Seed-Pruefung und DIN-5008-Pruefung. Ein Tag ist damit
          # die bewusste Entscheidung, und sie ist eine Handlung statt zwei.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json

      # Eine Adresse, die sich nie aendert.
      #
      # `releases/latest/download/<Dateiname>` fuehrt immer zur neuesten
      # Version -- aber nur, wenn der Dateiname gleich bleibt. Die gebaute
      # Datei heisst `Zehni_0.1.6_x64-setup.exe`, also aendert sich die Adresse
      # mit jeder Version, und jeder weitergegebene Link wird mit dem naechsten
      # Release ungueltig.
      #
      # Deshalb liegt dieselbe Datei zusaetzlich unter einem Namen ohne
      # Versionsnummer. Damit gibt es einen Link, den man einmal weitergibt:
      #
      #   https://github.com/Humba25/OpenZehni/releases/latest/download/Zehni-Setup.exe
      #
      # Das ist **dieselbe signierte Datei**, nur unter einem zweiten Namen --
      # nicht neu gebaut und nicht veraendert. Die Signatur kommt mit, damit
      # sie pruefbar bleibt.
      #
      # `latest.json` bleibt unberuehrt: Der Updater sucht weiter den
      # versionierten Namen, weil dessen Signatur dort hinterlegt ist.
      - name: Feste Download-Adresse bereitstellen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p fest && cd fest
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'Zehni_*_x64-setup.exe' --pattern 'Zehni_*_x64-setup.exe.sig'

          EXE=$(ls Zehni_*_x64-setup.exe)
          cp "$EXE" Zehni-Setup.exe
          cp "$EXE.sig" Zehni-Setup.exe.sig

          # Gleicher Inhalt, anderer Name -- nachgewiesen, nicht behauptet.
          if ! cmp -s "$EXE" Zehni-Setup.exe; then
            echo "Die Kopie weicht vom Original ab. Abbruch."
            exit 1
          fi

          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" Zehni-Setup.exe Zehni-Setup.exe.sig --clobber

  # ---------------------------------------------------------------------------
  # Zusaetzlich auf SourceForge anbieten.
  #
  # **Dieser Job darf den Release nie gefaehrden.** Er laeuft nach `bauen`, laedt
  # die bereits veroeffentlichten und signierten Dateien herunter und legt sie
  # dort ab. Schlaegt er fehl, ist der GitHub-Release trotzdem draussen und die
  # Update-Kette funktioniert -- der Updater fragt ausschliesslich GitHub.
  #
  # Ohne die beiden Secrets wird der Job uebersprungen statt zu scheitern. So
  # bleibt der Workflow benutzbar, solange die Einrichtung dort nicht steht.
  sourceforge:
    needs: bauen
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Ein Fehlschlag hier faerbt den Lauf nicht rot. Was zaehlt, ist `bauen`.
    continue-on-error: true

    steps:
      - name: Einrichtung pruefen
        id: pruefung
        shell: bash
        env:
          NUTZER: ${{ secrets.SOURCEFORGE_USER }}
          PROJEKT: ${{ secrets.SOURCEFORGE_PROJECT }}
        run: |
          if [ -z "$NUTZER" ] || [ -z "$PROJEKT" ]; then
            echo "SourceForge ist nicht eingerichtet. Uebersprungen."
            echo "weiter=nein" >> "$GITHUB_OUTPUT"
          else
            echo "weiter=ja" >> "$GITHUB_OUTPUT"
          fi

      - name: Veroeffentlichte Dateien holen
        if: steps.pruefung.outputs.weiter == 'ja'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p hochladen
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern 'Zehni_*_x64-setup.exe' --pattern 'Zehni_*_x64-setup.exe.sig' \
            --dir hochladen
          ls -l hochladen

      - name: SSH-Schluessel einrichten
        if: steps.pruefung.outputs.weiter == 'ja'
        env:
          SCHLUESSEL: ${{ secrets.SOURCEFORGE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SCHLUESSEL" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts

      # Der Ordner heisst wie die Version. SourceForge zeigt den neuesten
      # Ordner zuerst an und bietet die dortige .exe als Standard-Download an.
      - name: Hochladen
        if: steps.pruefung.outputs.weiter == 'ja'
        env:
          NUTZER: ${{ secrets.SOURCEFORGE_USER }}
          PROJEKT: ${{ secrets.SOURCEFORGE_PROJECT }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIEL="/home/frs/project/$PROJEKT/$VERSION/"
          rsync -av --chmod=ug=rwX,o=rX \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            hochladen/ "$NUTZER@frs.sourceforge.net:$ZIEL"
